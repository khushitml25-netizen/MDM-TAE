<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Digital Clock & Stopwatch</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
        }

        .clock-box {
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
        }

        .time-display {
            letter-spacing: 4px;
            text-shadow: 0 0 15px rgba(34, 211, 238, 0.5);
        }

        button {
            transition: all 0.2s ease;
        }

        button:hover {
            transform: translateY(-2px);
        }

        button:active {
            transform: scale(0.95);
        }

        .lap-item {
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* =========================
           TABLET
        ========================= */

        @media (max-width: 768px) {

            .time-display {
                letter-spacing: 2px;
            }

        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 480px) {

            body {
                padding: 10px;
            }

            .main-box {
                padding: 16px !important;
                border-radius: 20px !important;
            }

            .main-title {
                font-size: 26px !important;
            }

            .clock-section,
            .stopwatch-section,
            .lap-section {
                padding: 16px !important;
            }

            .clock-time {
                font-size: 32px !important;
                letter-spacing: 2px;
            }

            .stopwatch-time {
                font-size: 30px !important;
                letter-spacing: 1px;
            }

            .date-text {
                font-size: 13px;
            }

            .button-grid {
                gap: 8px !important;
            }

            .control-button {
                padding: 11px 6px !important;
                font-size: 14px !important;
            }

            .lap-item {
                gap: 8px;
            }

            .lap-time {
                font-size: 12px;
            }

            .delete-button {
                padding: 6px 8px !important;
                font-size: 12px !important;
            }

            .lap-heading {
                font-size: 18px !important;
            }

            .lap-count {
                font-size: 12px;
            }
        }


        /* =========================
           VERY SMALL PHONES
        ========================= */

        @media (max-width: 360px) {

            .main-box {
                padding: 12px !important;
            }

            .clock-time {
                font-size: 27px !important;
            }

            .stopwatch-time {
                font-size: 25px !important;
            }

            .control-button {
                font-size: 12px !important;
                padding: 10px 4px !important;
            }

            .lap-time {
                font-size: 11px;
            }
        }
    </style>
</head>


<body
    class="min-h-screen bg-gradient-to-br from-slate-900 via-blue-900 to-black flex items-center justify-center p-4 sm:p-6">

    <!-- MAIN CONTAINER -->

    <div
        class="main-box clock-box w-full max-w-lg bg-slate-800 rounded-3xl p-6 sm:p-8 text-white">

        <!-- =========================
             HEADING
        ========================== -->

        <div class="text-center mb-6">

            <h1
                class="main-title text-3xl sm:text-4xl font-bold text-cyan-400">

                Digital Clock

            </h1>

            <p class="text-slate-400 mt-2 text-sm sm:text-base">

                Clock & Stopwatch

            </p>

        </div>


        <!-- =========================
             DIGITAL CLOCK
        ========================== -->

        <div
            class="clock-section bg-slate-900 rounded-2xl p-5 sm:p-6 text-center mb-5">

            <div
                id="clock"
                class="clock-time time-display text-4xl sm:text-5xl font-bold text-cyan-300 break-all">

                00:00:00

            </div>

            <p
                id="date"
                class="date-text text-slate-400 mt-3">

                Loading...

            </p>

        </div>


        <!-- =========================
             STOPWATCH
        ========================== -->

        <div
            class="stopwatch-section bg-slate-900 rounded-2xl p-5 sm:p-6">

            <h2
                class="text-xl sm:text-2xl font-semibold text-center text-cyan-400 mb-5">

                Stopwatch

            </h2>


            <!-- STOPWATCH DISPLAY -->

            <div
                id="stopwatch"
                class="stopwatch-time time-display text-center text-4xl sm:text-5xl font-bold text-white mb-6 break-all">

                00:00:00.00

            </div>


            <!-- BUTTONS -->

            <div
                class="button-grid grid grid-cols-2 gap-3">

                <button
                    onclick="startStopwatch()"
                    class="control-button bg-green-600 hover:bg-green-500 rounded-xl py-3 px-2 font-semibold">

                    ▶ Start

                </button>


                <button
                    onclick="pauseStopwatch()"
                    class="control-button bg-yellow-600 hover:bg-yellow-500 rounded-xl py-3 px-2 font-semibold">

                    ⏸ Pause

                </button>


                <button
                    onclick="resetStopwatch()"
                    class="control-button bg-red-600 hover:bg-red-500 rounded-xl py-3 px-2 font-semibold">

                    🔄 Reset

                </button>


                <button
                    onclick="addLap()"
                    class="control-button bg-blue-600 hover:bg-blue-500 rounded-xl py-3 px-2 font-semibold">

                    🏁 Lap

                </button>

            </div>

        </div>


        <!-- =========================
             LAP RECORDS
        ========================== -->

        <div
            class="lap-section mt-5 bg-slate-900 rounded-2xl p-5 sm:p-6">

            <!-- LAP HEADER -->

            <div
                class="flex justify-between items-center mb-3 gap-2">

                <h2
                    class="lap-heading text-xl font-semibold text-cyan-400">

                    Lap Records

                </h2>


                <span
                    id="lapCount"
                    class="lap-count text-sm text-slate-400 whitespace-nowrap">

                    0 Laps

                </span>

            </div>


            <!-- LAP LIST -->

            <div
                id="laps"
                class="max-h-64 overflow-y-auto overflow-x-hidden">

                <p
                    id="noLaps"
                    class="text-center text-slate-500 py-4">

                    No laps recorded

                </p>

            </div>

        </div>

    </div>



    <script>

        /* =========================
           DIGITAL CLOCK
        ========================= */

        function updateClock() {

            const now = new Date();

            let hours = now.getHours();
            let minutes = now.getMinutes();
            let seconds = now.getSeconds();

            hours = String(hours).padStart(2, "0");
            minutes = String(minutes).padStart(2, "0");
            seconds = String(seconds).padStart(2, "0");


            document.getElementById("clock").textContent =
                `${hours}:${minutes}:${seconds}`;


            const options = {
                weekday: "long",
                year: "numeric",
                month: "long",
                day: "numeric"
            };


            document.getElementById("date").textContent =
                now.toLocaleDateString("en-US", options);

        }


        setInterval(updateClock, 1000);

        updateClock();



        /* =========================
           STOPWATCH VARIABLES
        ========================= */

        let startTime = 0;

        let elapsedTime = 0;

        let timerInterval = null;

        let running = false;

        let lapNumber = 0;

        let totalLaps = 0;



        /* =========================
           FORMAT STOPWATCH TIME
        ========================= */

        function formatStopwatch(time) {

            let milliseconds =
                Math.floor((time % 1000) / 10);


            let totalSeconds =
                Math.floor(time / 1000);


            let seconds =
                totalSeconds % 60;


            let totalMinutes =
                Math.floor(totalSeconds / 60);


            let minutes =
                totalMinutes % 60;


            let hours =
                Math.floor(totalMinutes / 60);


            hours =
                String(hours).padStart(2, "0");


            minutes =
                String(minutes).padStart(2, "0");


            seconds =
                String(seconds).padStart(2, "0");


            milliseconds =
                String(milliseconds).padStart(2, "0");


            return `${hours}:${minutes}:${seconds}.${milliseconds}`;

        }



        /* =========================
           UPDATE STOPWATCH
        ========================= */

        function updateStopwatch() {

            elapsedTime =
                Date.now() - startTime;


            document.getElementById("stopwatch").textContent =
                formatStopwatch(elapsedTime);

        }



        /* =========================
           START
        ========================= */

        function startStopwatch() {

            if (running) {
                return;
            }


            startTime =
                Date.now() - elapsedTime;


            timerInterval =
                setInterval(updateStopwatch, 10);


            running = true;

        }



        /* =========================
           PAUSE
        ========================= */

        function pauseStopwatch() {

            if (!running) {
                return;
            }


            clearInterval(timerInterval);


            elapsedTime =
                Date.now() - startTime;


            running = false;

        }



        /* =========================
           RESET
        ========================= */

        function resetStopwatch() {

            clearInterval(timerInterval);


            startTime = 0;

            elapsedTime = 0;

            running = false;


            /*
                Lap records are NOT deleted.
            */

            lapNumber = 0;


            document.getElementById("stopwatch").textContent =
                "00:00:00.00";

        }



        /* =========================
           ADD LAP
        ========================= */

        function addLap() {

            if (!running && elapsedTime === 0) {
                return;
            }


            lapNumber++;

            totalLaps++;


            const noLaps =
                document.getElementById("noLaps");


            if (noLaps) {
                noLaps.remove();
            }


            const lap =
                document.createElement("div");


            lap.className =
                "lap-item flex justify-between items-center gap-2 border-b border-slate-700 py-3";


            const lapTime =
                formatStopwatch(elapsedTime);


            lap.innerHTML = `

                <div class="flex-1 min-w-0">

                    <span class="text-cyan-400 font-semibold text-sm sm:text-base">

                        Lap ${lapNumber}

                    </span>

                </div>


                <div
                    class="lap-time text-white font-mono whitespace-nowrap">

                    ${lapTime}

                </div>


                <button
                    onclick="deleteLap(this)"
                    class="delete-button bg-red-600 hover:bg-red-500 text-white px-3 py-1.5 rounded-lg text-sm font-semibold shrink-0">

                    🗑️

                </button>

            `;


            document
                .getElementById("laps")
                .prepend(lap);


            updateLapCount();

        }



        /* =========================
           DELETE LAP
        ========================= */

        function deleteLap(button) {

            const lap =
                button.parentElement;


            lap.remove();


            totalLaps--;


            if (totalLaps < 0) {
                totalLaps = 0;
            }


            updateLapCount();


            const laps =
                document.getElementById("laps");


            if (laps.children.length === 0) {

                laps.innerHTML = `

                    <p
                        id="noLaps"
                        class="text-center text-slate-500 py-4">

                        No laps recorded

                    </p>

                `;

            }

        }



        /* =========================
           UPDATE LAP COUNT
        ========================= */

        function updateLapCount() {

            const lapCount =
                document.getElementById("lapCount");


            lapCount.textContent =
                `${totalLaps} ${totalLaps === 1 ? "Lap" : "Laps"}`;

        }

    </script>

</body>

</html>
